name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs-material

      # persist-credentials: false removes the checkout token from the runner's
      # git config, so ghp-import (used by `mkdocs gh-deploy`) cannot fetch or
      # push without explicit credentials. The URL rewrite below authenticates
      # its fetch + push with the job's contents:write token.
      - name: Build and Deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          mkdocs gh-deploy --force
