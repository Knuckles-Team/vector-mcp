---
# Docker Compose file for testing all vector database backends
# Compatible with docker-compose and podman-compose
# Usage: docker-compose -f docker-compose.test.yml up -d
# Or: podman-compose -f docker-compose.test.yml up -d

services:
  # PostgreSQL with PGVector ( ParadeDB for vector + BM25)
  postgres:
    image: docker.io/paradedb/paradedb@sha256:ac8ad72f57da6fa35738d346b9970811a4ab9ce0ba7f183bea27e0ad7b037222  # paradedb, originally tagged `latest-pg16`, pinned for reproducible tests
    container_name: vector-test-postgres
    # DB-server image bootstrap lives in test-db.env (not app config).
    env_file:
      - test-db.env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MongoDB
  mongodb:
    image: docker.io/mongo@sha256:2609aaf7a1abbff404101af896e05f243d22be742471ed857b50b9ce0270fdbd  # mongo, originally tagged `latest`, pinned for reproducible tests
    container_name: vector-test-mongodb
    command: mongod --noauth
    ports:
      - "27017:27017"

  # Qdrant
  qdrant:
    image: docker.io/qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10  # qdrant/qdrant, originally tagged `latest`, pinned for reproducible tests
    container_name: vector-test-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Couchbase
  couchbase:
    image: docker.io/couchbase@sha256:c4254e37f5a5db3d13eb990d89862765db44b4f96b6283190c2e6c8a20d760d7  # couchbase, originally tagged `latest`, pinned for reproducible tests
    container_name: vector-test-couchbase
    # DB-server image bootstrap lives in test-db.env (not app config).
    env_file:
      - test-db.env
    ports:
      - "8091:8091"
      - "8092:8092"
      - "8093:8093"
      - "11210:11210"

networks:
  default:
    name: vector-test-network
