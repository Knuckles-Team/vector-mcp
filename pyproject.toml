[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "vector-mcp"
version = "3.3.5"
description = "Governed vector retrieval over native epistemic-graph and secure opt-in providers."
readme = "README.md"
classifiers = [ "Development Status :: 5 - Production/Stable", "License :: Public Domain", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "scion-sdk[mcp]>=0.5.9,<0.6.0", "markdownify>=1.2.3", "beautifulsoup4>=4.15.0", "ebooklib>=0.20", "html2text>=2025.4.15", "ipython>=9.15.0", "platformdirs>=4.11.0", "pypdf>=6.14.2", "llama-index-core>=0.14.23", "llama-index-readers-file>=0.6.0",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.5.9,<0.6.0",]
postgres = [ "scion-sdk[vector]>=0.5.9,<0.6.0",]
qdrant = [ "scion-sdk[vector]>=0.5.9,<0.6.0",]
mongodb = [ "scion-sdk[vector]>=0.5.9,<0.6.0",]
chromadb = [ "scion-sdk[vector-chroma]>=0.5.9,<0.6.0",]
all = [ "vector-mcp[mcp,postgres,qdrant,mongodb,chromadb]>=2.1.2",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
vector-mcp = "vector_mcp.mcp_server:mcp_server"
vector-mcp-doctor = "vector_mcp.doctor:main"

[project.entry-points."agent_connector_sdk.prompt_providers"]
vector-mcp = "vector_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
vector-mcp = "vector_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
extend-exclude = ["tests", "scripts"]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
vector_mcp = [ "bundled_mcp.json", "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]


[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[tool.pipelines.container]
host = "0.0.0.0"
compose_host = "0.0.0.0"
debug_apt = ["default-jre", "ripgrep", "tree", "fd-find", "curl", "nano", "build-essential", "cmake", "libssl-dev", "libcurl4-openssl-dev", "pkg-config", "rustc", "cargo"]
compose_env = ["AUTH_TYPE=${MCP_AUTH_TYPE:?set MCP_AUTH_TYPE for network transport}"]
